services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: trippify
      POSTGRES_USER: trippify
      POSTGRES_PASSWORD: trippify_dev
    ports: ["5437:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trippify"]
      interval: 5s
      timeout: 5s
      retries: 12
