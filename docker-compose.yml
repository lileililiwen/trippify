services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: trippify
      POSTGRES_USER: trippify
      POSTGRES_PASSWORD: trippify_dev
    ports: ["5437:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trippify"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: src/Trippify.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Database=trippify;Username=trippify;Password=trippify_dev"
      SelfHosted__RunMigrationsOnStartup: "true"
      # Set RESEND_API_KEY to a real Resend API key to deliver confirmation
      # and password-reset emails. Leave unset to use the in-process stub
      # (registration succeeds, emails are silently dropped).
      # RESEND_API_KEY: "re_..."
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8080:8080"]
