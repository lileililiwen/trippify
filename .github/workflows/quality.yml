name: quality
on: [push, pull_request]
jobs:
  dotnet:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: trippify
          POSTGRES_PASSWORD: trippify_dev
          POSTGRES_DB: trippify
        ports:
          - 5437:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ConnectionStrings__Postgres: Host=127.0.0.1;Port=5437;Database=trippify;Username=trippify;Password=trippify_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet restore Trippify.sln
      - run: dotnet build Trippify.sln --no-restore --configuration Release
      - name: Test (architecture)
        run: dotnet test tests/Trippify.ArchitectureTests/Trippify.ArchitectureTests.csproj --no-build --configuration Release --verbosity normal
      - name: Test & coverage (api)
        # Coverage is gated on the API tests (currently ~92% line). The
        # architecture tests only reflect over the assemblies and execute no
        # source code, so they report ~0% coverage and are run without the gate.
        run: dotnet test tests/Trippify.ApiTests/Trippify.ApiTests.csproj --no-build --configuration Release --verbosity normal
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:Threshold=80
          /p:ThresholdType=line
          /p:ThresholdStat=total
          /p:FailOnError=true
          /p:CoverletOutput=./coverage/coverage
      - name: Upload dotnet coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-coverage
          path: tests/Trippify.ApiTests/coverage/coverage.cobertura.xml
          if-no-files-found: warn
  flutter:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/trippify_flutter } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: dart run tool/check_flutter_skips.dart
      - run: flutter analyze
      - name: Test with coverage
        run: flutter test --coverage
      - name: Enforce Flutter coverage threshold
        run: |
          COV=$(awk -F'[:%]' '/^SF:/{f=$2} /^LF:/{lf+=$2} /^LH:/{lh+=$2} END{printf "%.2f", (lf ? lh * 100 / lf : 0)}' coverage/lcov.info)
          echo "Flutter line coverage: ${COV}%"
          OK=$(awk -v c="$COV" 'BEGIN { print (c + 0 >= 30) ? 1 : 0 }')
          if [ "$OK" != "1" ]; then
            echo "Flutter coverage ${COV}% is below the 30% threshold"; exit 1
          fi
      - name: Upload Flutter coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: apps/trippify_flutter/coverage/lcov.info
          if-no-files-found: warn
  postgres-upgrade-drill:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: trippify
          POSTGRES_PASSWORD: trippify_dev
          POSTGRES_DB: trippify_drill
        ports:
          - 5437:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ConnectionStrings__Postgres: Host=127.0.0.1;Port=5437;Database=trippify_drill;Username=trippify;Password=trippify_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet tool install dotnet-ef -g --version 8.0.11
      - name: Build API
        run: dotnet build src/Trippify.Api --configuration Release
      - name: Apply migrations to empty database, downgrade to previous release, upgrade to head
        run: |
          dotnet ef database update \
            --project src/Trippify.Infrastructure \
            --startup-project src/Trippify.Api
          PREVIOUS=$(dotnet ef migrations list --project src/Trippify.Infrastructure --startup-project src/Trippify.Api | sed 's/[[:space:]]*$//' | grep -v 20260901043105_AddCheckoutIdempotency | tail -n 1)
          dotnet ef database update "$PREVIOUS" --project src/Trippify.Infrastructure --startup-project src/Trippify.Api
          dotnet ef database update --project src/Trippify.Infrastructure --startup-project src/Trippify.Api
      - name: Smoke against the upgraded schema
        run: |
          (ASPNETCORE_URLS=http://127.0.0.1:8765 SelfHosted__RunMigrationsOnStartup=false dotnet run --project src/Trippify.Api --no-build >/tmp/api.log 2>&1 &)
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/health/live >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          STATUS=$(curl -s -o /tmp/info.json -w "%{http_code}" http://127.0.0.1:8765/api/v1/system/info)
          if [ "$STATUS" != "200" ]; then
            echo "Smoke endpoint returned $STATUS"
            cat /tmp/info.json
            exit 1
          fi
